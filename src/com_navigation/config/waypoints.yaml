# ── 목적지 id 와 표시 라벨 관계 (2026-08-19) ────────────────────────────
# id 는 코드/서비스에서 쓰는 내부 키일 뿐이고, 화면에 보이는 한글 라벨과
# 1:1로 대응하지 않는다. 물리적 위치는 이름 변경 전과 동일하다.
#   class1~class5 -> 강의실1~5
#   info          -> 회의실      (id 이름만 바뀐 것, 인포가 아님)
#   office        -> 인포        (id 이름만 바뀐 것, 사무실이 아님)
#   meeting       -> 상담실      (id 이름만 바뀐 것, 회의실이 아님)
# 라벨을 id 뜻에 맞추려면 TFT 글리프(hangul_font.h)에 '사','무'를 추가해야 한다
# (현재 34종 보유: 강의실회인포상담목적지선택다시누르면출발조이스틱으로취소도착환영합니).
# 라벨은 waypoints.yaml / com_gui DESTINATIONS / eyes_board_jul31a.ino 세 곳에 있다.

# ── 경로(trajectory) 정의 ────────────────────────────────────────────────
# trajectory_1: 도킹 지점 -> 목적지 로 갈 때 목적지 앞에 먼저 거칠 공통 경유점
# trajectory_2: 목적지 -> 도킹 지점 으로 복귀할 때 거칠 공통 경유점
#
# 2026-08-19 현재 둘 다 비어 있다 = 도킹 지점과 목적지 사이를 Nav2 단일 goal로
# 직행한다는 뜻이다. 아래 way6~way16 경유점들은 그래서 하나도 안 쓰이고 있다.
# (예전엔 이 키 자체가 파일에 없어서 "직행"이 의도인지 빠뜨린 건지 구분이 안 됐다.
#  service_manager_node가 기동 시 미사용 경유점 목록을 warn으로 찍어준다.)
#
# 실제 복도 경로를 태우려면 아래 waypoint_ids에 순서대로 id를 나열할 것. 단
# 좌표가 실측으로 검증된 순서인지 먼저 확인하고 넣어야 한다 - 검증 안 된 순서를
# 넣으면 로봇이 벽으로 향하는 goal을 받게 된다.
trajectory_1:
  waypoint_ids: []
trajectory_2:
  waypoint_ids: []

waypoints:
  - id: docking
    # 2026-08-19: RViz 2D Pose Estimate로 재측정 (map 기준, 자세 포함).
    # yaw는 쿼터니언 z=0.6809751786150484, w=0.732306497383577 에서 환산:
    #   yaw = 2*atan2(z, w) = 1.498187 rad (85.84도)
    # 오늘 _send_nav_goal이 yaw를 실제로 반영하도록 고쳤으므로 이 값이 진짜로 쓰인다.
    label: "도킹"
    x: 0.5326756643036313
    y: 0.03834829532494814
    yaw: 1.4981870525

