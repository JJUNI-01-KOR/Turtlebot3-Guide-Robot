# com_navigation aruco_markers.yaml
#
# 개정 이력
# v1.0 (2026-07-27, 권오민) : 최초 작성 - 부스 A/B/C(11,12,13) + 도킹(99), 더미값
# v1.1 (2026-07-27, 권오민) : 목적지 8곳 구조로 변경, 도킹 마커 ID 99 -> 29로 변경
#                              사유: aruco_dictionary=DICT_4X4_50 (DDS-001/ICD-001 확정 사양)은
#                              ID 0~49까지만 지원하여 99는 생성/인식 자체가 불가능함
# v1.2 (2026-08-05) : 강의실1~5/인포/상담실/회의실 마커(21~28) 제거, 도킹 마커(29)만 유지
#                      사유: service_manager_node의 DockingController가 dock_marker_id(29)만
#                      필터링해서 쓰고 있고, 목적지(room1~room6) 도착 판정은 Nav2가
#                      waypoints.yaml 좌표 기준으로 하지 마커 인식과 무관 - 미사용 확인 후 정리
#
# 사전: DICT_4X4_50 | 마커 실제 크기: 10cm x 10cm (marker_size=0.10m, DDS-001 기준)

markers:
  - id: 29
    x: 0.05
    y: 0.0
    z: 0.15
    description: "충전스테이션 도킹 마커 (기존 99에서 변경, 권오민, 2026-07-27)"
