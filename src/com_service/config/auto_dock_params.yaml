
com_auto_dock_node:
  ros__parameters:
    # ═══ 1단계: 도킹 지점 (Nav2) ═══
    target_marker_id: 29
    # 2026-08-19: (0,0)은 map 원점이지 도킹 지점이 아니다. waypoints.yaml의
    # docking 좌표와 맞춰뒀다. skip_navigation:true 인 동안엔 안 쓰이지만,
    # false로 바꾸는 순간 로봇이 엉뚱한 map 원점으로 주행하게 된다.
    dock_approach_x: 0.5326756643036313
    dock_approach_y: 0.03834829532494814
    dock_approach_yaw: 1.4981870525
    map_frame: "map"
    skip_navigation: true       # 첫 테스트는 true
 
    # ═══ 2단계: 왼쪽 90도 회전 ═══
    # 2026-08-19: 0으로 변경. 도킹 지점 yaw를 마커 정면으로 재측정해뒀으므로
    # 도착 후 추가 회전이 필요 없다 (돌면 마커가 화각을 벗어난다).
    turn_left_angle: 0.0
    turn_speed: 0.4
    turn_tolerance: 0.035
 
    # ═══ 3단계: 마커 확인 ═══
    # aruco detection_rate=5Hz 이므로 1.0초 미만으로 내리지 말 것
    marker_timeout: 1.0
    find_settle_time: 1.5
    enable_fallback_sweep: true
    sweep_angle: 0.436
    sweep_speed: 0.25
 
    # ═══ 4단계: 접근 (정렬 통합) ═══
    k_lateral: 0.8
    k_yaw: 0.5                  # 반대로 돌면 -0.5
    use_yaw_term: true          # false면 기존 DockingController와 동일 동작
    approach_speed: 0.06
    max_angular: 0.4
    near_max_angular: 0.2
    near_distance: 0.4
    min_dock_distance: 0.25     # 실측 필요
 
    # ═══ 6단계: 초음파 후진 ═══
    ultrasonic_topic: "/com_sensors/rear_distance"
    rear_obstacle_topic: "/com_sensors/rear_obstacle"
    ultrasonic_offset: 0.0      # 센서면 - 뒷범퍼 (실측)
    # 2026-08-19: 아두이노에 R: 단독 라인(100ms) 펌웨어를 업로드해 실측 10.4Hz가
    # 확인되어 1.5로 되돌림. (업로드 전에는 0.50Hz라 4.0으로 임시 완화했었다)
    ultrasonic_timeout: 1.5
    ultrasonic_min_valid: 0.02
    ultrasonic_max_valid: 2.0
    target_gap: 0.03
    gap_tolerance: 0.005
    # 2026-08-19: 후진은 초음파 폐루프라 센서가 느리면 벽에 박는다. 수신 간격이
    # 이 값보다 길면 /start_docking 이 거부된다(auto_dock_node.srv_start).
    # 현재 펌웨어(R: 단독 라인 100ms, 실측 9.5~10.4Hz)에서는 통과한다. 펌웨어를
    # 되돌리면 도킹이 시작되지 않는데, 그건 고장이 아니라 의도된 차단이다.
    max_ultrasonic_interval: 0.5
    reverse_speed: 0.04
    reverse_min_speed: 0.015
    k_reverse: 0.35
    max_reverse_distance: 0.6
 
    # ═══ 7단계: 음성 ═══
    tts_topic: "/tts_request"
    tts_text_key: "docked_arrive"   # audio/docked_arrive.wav
    tts_sound_effect: ""
 
    # ═══ 기타 ═══
    publish_mission_state: true
    timeout_turn_left: 20.0
    timeout_find: 30.0
    timeout_approach: 90.0
    timeout_turn_180: 25.0
    timeout_reverse: 60.0
 